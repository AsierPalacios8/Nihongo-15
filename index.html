<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo 15</title>
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nihongo 15">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1d1b19;--muted:#6f6a63;--line:#e8e2d8;
  --red:#c8102e;--red-soft:#fbe9ec;--green:#2f7d4f;--green-soft:#e4f3ea;--shadow:0 2px 10px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141312;--card:#1f1d1b;--ink:#f3efe9;--muted:#a39d95;--line:#33302c;
  --red:#ff4d5e;--red-soft:#3a1d21;--green:#5cc489;--green-soft:#1c3226;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:18px;margin:22px 0 10px}
p{line-height:1.45}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:600;
  background:var(--red);color:#fff;width:100%;cursor:pointer}
.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);border:0;padding:10px}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.45}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dot{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);background:var(--card)}
.dot.done{background:var(--green);color:#fff;border-color:var(--green)}
.dot.next{border:2px solid var(--red);color:var(--red);font-weight:700}
.weeklabel{font-size:12px;color:var(--muted);margin:10px 0 4px}
.phrase{font-size:30px;font-weight:700;line-height:1.2;margin:6px 0}
.meaning{font-size:18px;color:var(--muted)}
.jp{font-size:20px;margin-top:6px;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--red);transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.counter{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
.reps{display:flex;gap:6px;justify-content:center;margin-top:8px}
.reps span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.reps span.on{background:var(--red);border-color:var(--red)}
.tip{background:var(--red-soft);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4}
.list .item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item div{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:18px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.active{color:var(--red);font-weight:700}
.hidden{display:none!important}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
label.switch{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
input[type=range]{width:100%}
.center{text-align:center}
.big-emoji{font-size:56px;text-align:center;margin:10px 0}
.warn{background:#fff4d6;color:#6b4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
@media (prefers-color-scheme: dark){.warn{background:#3a3016;color:#f2d68a}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-tab="home" class="active"><span>🏠</span>Hoy</button>
  <button data-tab="phrases"><span>📖</span>Frases</button>
  <button data-tab="settings"><span>⚙️</span>Ajustes</button>
</nav>

<script src="data.js"></script>
<script>
// ---------- Estado ----------
const KEY = "nihongo15-v1";
const defaults = { done:{}, history:{}, minutes:{}, showJp:false, rate:0.9, known:{} };
let S = load();
function load(){ try{ return Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ return Object.assign({}, defaults); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// Lista lineal de lecciones: 4 semanas × (5 días + repaso de fin de semana)
const LESSONS = [];
WEEKS.forEach((w, wi) => {
  w.days.forEach((d, di) => LESSONS.push({ id:`${wi+1}-${di+1}`, week:wi, day:di, type:"new", title:d.title, tip:d.tip, challenge:d.challenge, phrases:d.phrases }));
  const all = w.days.flatMap(d => d.phrases);
  LESSONS.push({ id:`${wi+1}-6`, week:wi, day:5, type:"review", title:"Repaso de la semana", tip:"Hoy no hay frases nuevas: repasa toda la semana.", challenge:w.weekend, phrases:all });
});
const ALL_PHRASES = LESSONS.filter(l => l.type==="new").flatMap(l => l.phrases.map(p => ({...p, lesson:l.id})));
const pkey = p => p.r;

function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nextLesson(){ return LESSONS.find(l => !S.done[l.id]) || null; }
function streak(){
  let n=0; const d=new Date();
  if(!S.history[today()]) d.setDate(d.getDate()-1); // la racha sigue viva si aún no has practicado hoy
  while(true){ const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(S.history[k]){ n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function totalMinutes(){ return Math.round(Object.values(S.minutes).reduce((a,b)=>a+b,0)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- Voz ----------
let jaVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /ja[-_]JP/i.test(v.lang) && /google|kyoko|o-ren|siri/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; if(jaVoice) u.voice = jaVoice;
  u.rate = slow ? Math.max(0.45, S.rate - 0.35) : S.rate;
  speechSynthesis.speak(u);
}

// ---------- Grabación ----------
let rec = null, chunks = [], recUrl = null;
async function toggleRecord(btn, playBtn){
  if(rec && rec.state === "recording"){ rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if(recUrl) URL.revokeObjectURL(recUrl);
      recUrl = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "audio/mp4" }));
      btn.textContent = "🎙 Grabar"; playBtn.disabled = false;
    };
    rec.start(); btn.textContent = "⏹ Parar";
  }catch(e){ alert("No se pudo usar el micrófono. Revisa los permisos del navegador."); }
}
function playRecording(){ if(recUrl) new Audio(recUrl).play(); }

// ---------- Temporizador de sesión ----------
let timer = null, sessionStart = 0;
const SESSION_SECONDS = 15*60;
function startTimer(){
  sessionStart = Date.now(); clearInterval(timer);
  timer = setInterval(updateTimer, 1000); updateTimer();
}
function elapsed(){ return Math.floor((Date.now()-sessionStart)/1000); }
function updateTimer(){
  const el = document.getElementById("timer"); if(!el) return;
  const left = SESSION_SECONDS - elapsed();
  const abs = Math.abs(left), m = Math.floor(abs/60), s = abs%60;
  el.textContent = (left<0?"+":"") + `${m}:${String(s).padStart(2,"0")}`;
  el.style.color = left<0 ? "var(--green)" : "";
}
function stopTimer(){
  clearInterval(timer); timer=null;
  if(sessionStart){ const k=today(); S.minutes[k]=(S.minutes[k]||0)+elapsed()/60; sessionStart=0; save(); }
}

// ---------- Navegación ----------
const app = document.getElementById("app");
const nav = document.getElementById("nav");
let tab = "home";
nav.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(session && !confirm("¿Salir de la sesión? El progreso de hoy no se guardará.")) return;
  endSession(false); tab = b.dataset.tab; render();
});
function render(){
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
  nav.classList.toggle("hidden", !!session);
  window.scrollTo(0,0);
  if(session) return renderSession();
  ({home:renderHome, phrases:renderPhrases, settings:renderSettings})[tab]();
}

// ---------- Inicio ----------
function renderHome(){
  const next = nextLesson(); const st = streak(); const doneToday = !!S.history[today()];
  const doneCount = Object.keys(S.done).length;
  let gridHtml = "";
  WEEKS.forEach((w, wi) => {
    gridHtml += `<div class="weeklabel">Semana ${wi+1} · ${esc(w.title)}</div><div class="grid">`;
    for(let d=1; d<=6; d++){
      const id=`${wi+1}-${d}`, isDone=!!S.done[id], isNext=next && next.id===id;
      gridHtml += `<div class="dot ${isDone?"done":""} ${isNext?"next":""}">${d===6?"★":d}</div>`;
    }
    gridHtml += `</div>`;
  });
  const voiceWarn = !("speechSynthesis" in window) ? `<div class="warn">Tu navegador no tiene voz. Prueba con Safari (iPhone) o Chrome (Android).</div>` : "";
  app.innerHTML = `
    <h1>こんにちは, Asier</h1>
    <p class="muted">15 minutos al día. Hablar y pronunciar.</p>
    ${voiceWarn}
    <div class="card row">
      <div class="stat"><b>${st}🔥</b><span class="small muted">días seguidos</span></div>
      <div class="stat"><b>${doneCount}/${LESSONS.length}</b><span class="small muted">lecciones</span></div>
      <div class="stat"><b>${totalMinutes()}</b><span class="small muted">minutos</span></div>
    </div>
    ${next ? `
    <div class="card">
      <div class="row between"><span class="pill">Semana ${next.week+1} · ${next.type==="review"?"Fin de semana":"Día "+(next.day+1)}</span>
      ${doneToday?`<span class="pill green">Hoy ✓</span>`:""}</div>
      <h2 style="margin-top:12px">${esc(next.title)}</h2>
      <p class="muted">${next.type==="review" ? `Repaso de ${next.phrases.length} frases + reto del fin de semana` : `${next.phrases.length} frases nuevas · repaso · práctica`}</p>
      <button class="btn" id="start">${doneToday ? "Hacer otra lección" : "Empezar sesión de 15 min"}</button>
    </div>` : `
    <div class="card center"><div class="big-emoji">🎉</div><h2>¡Plan completado!</h2>
      <p class="muted">Sigue repasando cada día con el modo repaso libre.</p></div>`}
    <button class="btn secondary" id="free">Repaso libre (frases ya vistas)</button>
    <h2>Tu progreso</h2>
    <div class="card">${gridHtml}</div>`;
  const s = document.getElementById("start"); if(s) s.onclick = () => startSession(next);
  document.getElementById("free").onclick = () => {
    const seen = ALL_PHRASES.filter(p => S.done[p.lesson]);
    if(!seen.length){ alert("Aún no has completado ninguna lección."); return; }
    startSession({ id:"free", type:"free", title:"Repaso libre", phrases:[], tip:"", challenge:"" });
  };
}

// ---------- Sesión ----------
// Pasos: repaso (frases anteriores) → nuevas (escuchar/repetir/grabar) → práctica (recordar) → final
let session = null;
function startSession(lesson){
  const prevSeen = ALL_PHRASES.filter(p => S.done[p.lesson] && p.lesson !== lesson.id);
  // prioriza las que marcaste como "repasar"
  const weak = shuffle(prevSeen.filter(p => S.known[pkey(p)] === false));
  const rest = shuffle(prevSeen.filter(p => S.known[pkey(p)] !== false));
  let steps = [];
  if(lesson.type === "new"){
    const review = weak.concat(rest).slice(0, 6);
    review.forEach(p => steps.push({ kind:"recall", phase:"Repaso", p }));
    steps.push({ kind:"intro", phase:"Nuevas", lesson });
    lesson.phrases.forEach(p => steps.push({ kind:"learn", phase:"Nuevas", p }));
    shuffle(lesson.phrases).forEach(p => steps.push({ kind:"recall", phase:"Práctica", p }));
  } else if(lesson.type === "review"){
    steps.push({ kind:"intro", phase:"Repaso", lesson });
    shuffle(lesson.phrases).forEach(p => steps.push({ kind:"recall", phase:"Repaso", p }));
  } else {
    weak.concat(rest).slice(0, 15).forEach(p => steps.push({ kind:"recall", phase:"Repaso", p }));
  }
  steps.push({ kind:"finish", phase:"Final", lesson });
  session = { lesson, steps, i:0, reps:0, revealed:false };
  startTimer(); render();
}
function endSession(completed){
  if(!session) return;
  stopTimer();
  if(completed){
    const l = session.lesson;
    if(l.type !== "free") S.done[l.id] = today();
    S.history[today()] = true; save();
  }
  session = null; if(recUrl){ URL.revokeObjectURL(recUrl); recUrl=null; }
}
function nextStep(){ session.i++; session.reps=0; session.revealed=false; session.spoken=false; render(); }

function renderSession(){
  const st = session.steps[session.i];
  const pct = Math.round(session.i / (session.steps.length-1) * 100);
  const head = `
    <div class="row between">
      <button class="btn ghost" id="quit" style="width:auto">✕ Salir</button>
      <span class="pill">${st.phase}</span>
      <span class="timer" id="timer">15:00</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>`;
  let body = "";
  const jpLine = p => S.showJp ? `<div class="jp">${esc(p.jp)}</div>` : "";
  const hearTag = p => p.hear ? `<span class="pill" style="margin-bottom:6px">👂 Te lo dicen a ti</span>` : "";

  if(st.kind === "intro"){
    const l = st.lesson;
    body = `<div class="card">
      <span class="pill">Semana ${l.week+1} · ${l.type==="review"?"Fin de semana":"Día "+(l.day+1)}</span>
      <h2>${esc(l.title)}</h2>
      <div class="tip">💡 ${esc(l.tip)}</div>
      <p class="muted small">${l.type==="review" ? "Intenta recordar cada frase antes de verla. Dila en voz alta." : "Para cada frase: escucha, repite 5 veces imitando el ritmo y grábate para comparar."}</p>
      <button class="btn" id="go">Empezar</button></div>`;
  }
  if(st.kind === "learn"){
    const p = st.p;
    const dots = [0,1,2,3,4].map(i => `<span class="${i<session.reps?"on":""}"></span>`).join("");
    body = `<div class="card">
      ${hearTag(p)}
      <div class="phrase">${esc(p.r)}</div>
      <div class="meaning">${esc(p.es)}</div>
      ${jpLine(p)}
      <div class="btns">
        <button class="btn" id="play">▶ Escuchar</button>
        <button class="btn secondary" id="slow">🐢 Lento</button>
      </div>
      <div class="btns">
        <button class="btn secondary" id="rec">🎙 Grabar</button>
        <button class="btn secondary" id="playrec" ${recUrl?"":"disabled"}>🔁 Escucharme</button>
      </div>
      <div class="counter">Repite en voz alta y toca el botón cada vez</div>
      <div class="reps">${dots}</div>
      <div class="btns">
        <button class="btn secondary" id="rep">+1 repetición</button>
        <button class="btn ${session.reps>=5?"green":"secondary"}" id="next">Siguiente →</button>
      </div></div>`;
  }
  if(st.kind === "recall"){
    const p = st.p;
    body = `<div class="card">
      ${hearTag(p)}
      <p class="muted small">${p.hear ? "¿Qué te están diciendo? Dilo en japonés en voz alta:" : "¿Cómo se dice? Dilo en voz alta antes de mirar:"}</p>
      <div class="phrase" style="font-size:24px">${esc(p.es)}</div>
      ${session.revealed ? `
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div class="phrase">${esc(p.r)}</div>${jpLine(p)}
        <div class="btns"><button class="btn secondary" id="play">▶ Escuchar</button><button class="btn secondary" id="slow">🐢 Lento</button></div>
        <div class="btns">
          <button class="btn secondary" id="bad">😕 Repasar</button>
          <button class="btn green" id="good">😀 La sabía</button>
        </div>` : `
        <button class="btn" id="reveal" style="margin-top:14px">Ver respuesta</button>`}
    </div>`;
  }
  if(st.kind === "finish"){
    const l = st.lesson;
    body = `<div class="card center">
      <div class="big-emoji">🎌</div>
      <h2>¡Sesión completada!</h2>
      ${l.challenge ? `<div class="tip" style="text-align:left"><b>Reto de hoy:</b> ${esc(l.challenge)}</div>` : ""}
      <p class="muted small">Otsukaresama deshita!</p>
      <button class="btn green" id="done">Guardar y terminar</button></div>`;
  }
  app.innerHTML = head + body;
  updateTimer();

  const $ = id => document.getElementById(id);
  $("quit").onclick = () => { if(confirm("¿Salir de la sesión? El progreso de hoy no se guardará.")){ endSession(false); render(); } };
  if($("go")) $("go").onclick = nextStep;
  if(st.p){
    if($("play")) $("play").onclick = () => speak(st.p.jp, false);
    if($("slow")) $("slow").onclick = () => speak(st.p.jp, true);
  }
  if(st.kind === "learn"){
    if(!session.spoken){ session.spoken = true; setTimeout(() => speak(st.p.jp, false), 250); }
    $("rec").onclick = () => toggleRecord($("rec"), $("playrec"));
    $("playrec").onclick = playRecording;
    $("rep").onclick = () => { session.reps = Math.min(5, session.reps+1); render(); };
    $("next").onclick = () => { if(recUrl){ URL.revokeObjectURL(recUrl); recUrl=null; } nextStep(); };
  }
  if(st.kind === "recall"){
    if($("reveal")) $("reveal").onclick = () => { session.revealed = true; render(); speak(st.p.jp, false); };
    if($("good")) $("good").onclick = () => { S.known[pkey(st.p)] = true; save(); nextStep(); };
    if($("bad")) $("bad").onclick = () => {
      S.known[pkey(st.p)] = false; save();
      // vuelve a aparecer al final de la sesión
      session.steps.splice(session.steps.length-1, 0, { kind:"recall", phase:st.phase, p:st.p });
      nextStep();
    };
  }
  if(st.kind === "finish") $("done").onclick = () => { endSession(true); tab="home"; render(); };
}

// ---------- Frases ----------
function renderPhrases(){
  app.innerHTML = `<h1>Frases</h1><p class="muted">Todas las frases del plan. Toca ▶ para escucharlas.</p>
    <input type="search" id="q" placeholder="Buscar en español o rōmaji…">
    <div id="plist"></div>`;
  const draw = () => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    let html = "";
    LESSONS.filter(l => l.type==="new").forEach(l => {
      const ps = l.phrases.filter(p => !q || p.r.toLowerCase().includes(q) || p.es.toLowerCase().includes(q));
      if(!ps.length) return;
      html += `<h2>Semana ${l.week+1} · Día ${l.day+1} · ${esc(l.title)} ${S.done[l.id]?"✓":""}</h2><div class="card list">`;
      ps.forEach(p => {
        const i = ALL_PHRASES.findIndex(x => x.r===p.r && x.lesson===l.id);
        html += `<div class="item"><div><b>${esc(p.r)}</b>${p.hear?" 👂":""}<br><span class="muted small">${esc(p.es)}</span>${S.showJp?`<br><span class="muted small">${esc(p.jp)}</span>`:""}</div>
          <button class="icon-btn" data-i="${i}">▶</button></div>`;
      });
      html += `</div>`;
    });
    document.getElementById("plist").innerHTML = html || `<p class="muted">Sin resultados.</p>`;
  };
  document.getElementById("q").oninput = draw;
  document.getElementById("plist").onclick = e => { const b=e.target.closest("button[data-i]"); if(b) speak(ALL_PHRASES[+b.dataset.i].jp, false); };
  draw();
}

// ---------- Ajustes ----------
function renderSettings(){
  app.innerHTML = `<h1>Ajustes</h1>
    <div class="card">
      <label class="switch"><span>Mostrar escritura japonesa<br><span class="small muted">Desactivado = solo rōmaji</span></span>
        <input type="checkbox" id="jp" ${S.showJp?"checked":""}></label>
      <div style="padding:12px 0">
        <div class="row between"><span>Velocidad de la voz</span><span id="rv">${S.rate.toFixed(2)}</span></div>
        <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${S.rate}">
        <button class="btn secondary" id="test" style="margin-top:8px">▶ Probar voz</button>
        <p class="small muted" id="vname">Voz: ${jaVoice ? esc(jaVoice.name) : "la predeterminada del sistema"}</p>
      </div>
    </div>
    <div class="card">
      <b>Recordatorio diario</b>
      <p class="small muted">Pon una alarma o un recordatorio repetido en el móvil a la misma hora cada día (por ejemplo, al llegar al club o antes de cenar). Es lo que más ayuda a no romper la racha.</p>
    </div>
    <div class="card">
      <b>Progreso</b>
      <p class="small muted">Se guarda solo en este móvil.</p>
      <button class="btn secondary" id="reset">Borrar progreso</button>
    </div>
    <p class="center small muted">Nihongo 15 · v1</p>`;
  document.getElementById("jp").onchange = e => { S.showJp = e.target.checked; save(); };
  document.getElementById("rate").oninput = e => { S.rate = +e.target.value; document.getElementById("rv").textContent = S.rate.toFixed(2); save(); };
  document.getElementById("test").onclick = () => speak("よろしくお願いします", false);
  document.getElementById("reset").onclick = () => { if(confirm("¿Seguro? Se borrará todo tu progreso.")){ S = Object.assign({}, defaults); save(); render(); } };
}

render();
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
